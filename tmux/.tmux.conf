set -g mouse on
setw -g aggressive-resize on
set-window-option -g xterm-keys on

set -ga terminal-overrides ",xterm-256color:Tc"

set -sg escape-time 10

# ── Status bar ────────────────────────────────────────────────
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#262626,fg=#8a8a8a"

# 左側：不放 session 名（保持像圖片一樣乾淨），只留一點內縮
set -g status-left ""
set -g status-left-length 0

# 右側：日期 DD/MM ＋ 時間 HH:MM:SS，淺一階底色的區塊
set -g status-right "#[bg=#3a3a3a,fg=#d75f87,bold] %d/%m  %H:%M:%S "
set -g status-right-length 40

# 視窗清單：index:name + flag（* 當前、- 上一個、Z zoom）
setw -g window-status-format         "#[fg=#6c6c6c] #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format "#[fg=#5fd7d7,bold] #I:#W#[fg=#87d787]#{?window_flags,#{window_flags}, } "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#d7af5f"
setw -g window-status-bell-style     "fg=#d75f5f,bold"

# pane 邊框配合暗色
set -g pane-border-style        "fg=#3a3a3a"
set -g pane-active-border-style "fg=#5fd7d7"

# 訊息列
set -g message-style "bg=#3a3a3a,fg=#d75f87,bold"

# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Save / restore tmux session, windows, panes, layout
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Auto save / auto restore
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto save every 15 minutes
set -g @continuum-save-interval '15'

# Auto restore when tmux starts
set -g @continuum-restore 'on'

# Optional: also restore pane current directory
set -g @resurrect-capture-pane-contents 'on'

# 多 worktree 切換器（fzf 選單：已開就切過去，沒開就依固定布局新建）
# 傳入目前 pane 所在目錄（判斷是哪個 git repo）、client 與其高度；腳本算出清單筆數後自己開剛好高度的 popup
bind-key g run-shell -b '~/dotfiles/tmux/scripts/wt-picker.sh "#{pane_current_path}" "#{client_name}" "#{client_height}"'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
